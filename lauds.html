   <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const canvas = document.getElementById("pdf-canvas");
    const ctx = canvas.getContext("2d");
    const pageInfo = document.getElementById("pageInfo");
    let currentPdf = null;
    let currentPage = 1;
    let totalPages = 0;
    let currentPdfUrl = ""; // Track current PDF URL
    const scale = 3.0;

    const searchMap = {
      "pasaka": "pdfs/Pasaka.pdf",
      "kwaresma": "pdfs/Kwaresma.pdf",
      "majilio": "pdfs/MajilioNaNoeli.pdf",
      "noeli": "pdfs/MajilioNaNoeli.pdf",
      "masifu ya asubuhi": "pdfs/MasifuYaAsubuhi.pdf",
      "mwaka 1": "pdfs/MwakaSehemu1.pdf",
      "mwaka 2": "pdfs/MwakaSehemu2.pdf",
      "mwaka 3": "pdfs/MwakaSehemu3.pdf"
    };

    // Function to get saved page for a PDF
    function getSavedPage(pdfUrl) {
      const savedPages = JSON.parse(localStorage.getItem('pdfPages') || '{}');
      return savedPages[pdfUrl] || 1; // Default to page 1 if not found
    }

    // Function to save current page for current PDF
    function saveCurrentPage() {
      if (!currentPdf || !currentPdfUrl) return;
      
      const savedPages = JSON.parse(localStorage.getItem('pdfPages') || '{}');
      savedPages[currentPdfUrl] = currentPage;
      localStorage.setItem('pdfPages', JSON.stringify(savedPages));
    }

    async function renderPage(pageNum, direction = "none") {
      if (!currentPdf) return;

      const page = await currentPdf.getPage(pageNum);
      const viewport = page.getViewport({ scale });

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      // CSS size to visually fit without zooming the whole page
      canvas.style.width = `${viewport.width / scale}px`;
      canvas.style.height = `${viewport.height / scale}px`;

      // Optional animation
      canvas.style.transform = direction === "left" ? "translateX(100%)"
        : direction === "right" ? "translateX(-100%)"
        : "translateX(0)";
      canvas.style.opacity = "0";

      setTimeout(async () => {
        await page.render({ canvasContext: ctx, viewport }).promise;
        canvas.style.transform = "translateX(0)";
        canvas.style.opacity = "1";
        pageInfo.textContent = `Ukurasa ${currentPage} ya ${totalPages}`;
        
        // Save the current page whenever it changes
        saveCurrentPage();
      }, 150);
    }

    async function loadPDF(url) {
      try {
        // Save current page before loading new PDF
        if (currentPdf && currentPdfUrl) {
          saveCurrentPage();
        }

        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        currentPdf = pdf;
        currentPdfUrl = url; // Store current PDF URL
        totalPages = pdf.numPages;
        
        // Get saved page or default to 1
        currentPage = getSavedPage(url);
        
        renderPage(currentPage);
      } catch (err) {
        alert("PDF haikuweza kupakiwa: " + url);
        console.error(err);
      }
    }

    document.getElementById("searchInput").addEventListener("change", () => {
      const input = document.getElementById("searchInput").value.trim().toLowerCase();
      const file = searchMap[input];
      if (file) {
        loadPDF(file);
      } else {
        alert("Samahani, hati hiyo haijapatikana.");
      }
    });

    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (!currentPdf) return;

      if (x < rect.width / 2 && currentPage > 1) {
        currentPage--;
        renderPage(currentPage, "right");
      } else if (x >= rect.width / 2 && currentPage < totalPages) {
        currentPage++;
        renderPage(currentPage, "left");
      }
    });

    // Dark theme toggle
    const themeToggle = document.getElementById("themeToggle");
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    });

    // Apply saved theme and load default PDF
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
      }
      loadPDF("pdfs/MasifuYaAsubuhi.pdf");
    });
  </script>
